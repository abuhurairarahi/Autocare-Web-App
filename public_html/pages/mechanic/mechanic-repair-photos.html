<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare Mechanic - Repair Photos</title>
    <link rel="stylesheet" href="../../assets/css/mechanic/mechanic-repair-photos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/shared/default-sidebar-topbar-style.css">
</head>

<body>
    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <span class="brand-icon"><i class="fa-solid fa-car"></i></span>
                <span class="brand-name">
                    <span style="color: #ffffff;">Auto</span><span style="color: #f97316;">Care</span>
                </span>
            </div>

            <!-- Nav Bar -->
            <nav class="nav">
                <a href="mechanic-dashboard.html" class="nav-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="mechanic-assigned-jobs.html" class="nav-item"><i class="fa-solid fa-clipboard-list"></i> Assigned Jobs</a>
                <a href="mechanic-workflow.html" class="nav-item"><i class="fa-solid fa-diagram-project"></i> Progress</a>
                <a href="mechanic-parts-labor.html" class="nav-item"><i class="fa-solid fa-toolbox"></i> Parts &amp; Labor</a>
                <a href="mechanic-repair-photos.html" class="nav-item active"><i class="fa-solid fa-camera"></i> Update Photos</a>
                <a href="mechanic-fault-report.html" class="nav-item"><i class="fa-solid fa-triangle-exclamation"></i> Report Faults</a>
                <a href="mechanic-chat.html" class="nav-item"><i class="fa-solid fa-comments"></i> Chats</a>
            </nav>

            <a class="logout" href="../login.html">
                <span><i class="fa-solid fa-right-from-bracket"></i></span>Logout
            </a>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <!-- Top Bar -->
            <header class="topbar">
                <div class="search">
                    <div class="search-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                    <input type="text" placeholder="Search managers, workshops...">
                </div>

                <div class="top-actions">
                    <div class="notification">
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <b></b>
                    </div>

                    <div class="mail">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>

                    <div class="avatar">A</div>
                </div>
            </header>

            <!-- Page content -->
            <section class="content">
                <div class="rp-wrap">

                    <!-- Page header -->
                    <div class="rp-header">
                        <div class="rp-header__text">
                            <h1>Vehicle Repair Gallery</h1>
                            <p>Job #VR-8842 &bull; 2019 Ford Transit</p>
                        </div>
                        <button type="button" class="rp-btn rp-btn--primary"><i class="fa-solid fa-upload"></i> Upload New</button>
                    </div>

                    <!-- Gallery grid -->
                    <div class="rp-grid">

                        <!-- Before -->
                        <section class="rp-col">
                            <h2 class="rp-col__title"><span class="rp-dot rp-dot--before"></span> Before</h2>

                            <div class="rp-cards">
                                <figure class="rp-card">
                                    <div class="rp-card__image">
                                        <img src="../../assets/images/repair-photo-front-bumper-damage.jpg" alt="Front bumper damage before repair">
                                        <div class="rp-card__overlay">
                                            <button type="button" class="rp-overlay-btn rp-overlay-btn--view" aria-label="View photo"><i class="fa-solid fa-eye"></i></button>
                                            <button type="button" class="rp-overlay-btn rp-overlay-btn--delete" aria-label="Delete photo"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                    <figcaption class="rp-card__caption">
                                        <span class="rp-card__name">Front Bumper Damage</span>
                                        <span class="rp-card__date">Oct 12, 08:30</span>
                                    </figcaption>
                                </figure>

                                <figure class="rp-card">
                                    <div class="rp-card__image">
                                        <img src="../../assets/images/repair-photo-side-panel-scuffs.jpg" alt="Scratched side panel before repair">
                                        <div class="rp-card__overlay">
                                            <button type="button" class="rp-overlay-btn rp-overlay-btn--view" aria-label="View photo"><i class="fa-solid fa-eye"></i></button>
                                            <button type="button" class="rp-overlay-btn rp-overlay-btn--delete" aria-label="Delete photo"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                    <figcaption class="rp-card__caption">
                                        <span class="rp-card__name">Side Panel Scuffs</span>
                                        <span class="rp-card__date">Oct 12, 08:35</span>
                                    </figcaption>
                                </figure>
                            </div>
                        </section>

                        <!-- After -->
                        <section class="rp-col">
                            <h2 class="rp-col__title"><span class="rp-dot rp-dot--after"></span> After</h2>

                            <button type="button" class="rp-upload-placeholder">
                                <i class="fa-solid fa-camera"></i>
                                <span>Add Final Photo</span>
                            </button>
                        </section>
                    </div>
                </div>
            </section>
        </main>

    </div>
</body>

</html>
