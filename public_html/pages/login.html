<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to AutoForge — AutoCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

  <div class="page">

    <!-- Logo -->
    <a class="logo" href="#">
      <span class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4 16.5V11l2.2-4.4A2 2 0 0 1 8 5.5h8a2 2 0 0 1 1.8 1.1L20 11v5.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V16H7v.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"
            stroke="white" stroke-width="1.6" stroke-linejoin="round" />
          <circle cx="7.5" cy="14" r="1.3" fill="white" />
          <circle cx="16.5" cy="14" r="1.3" fill="white" />
          <path d="M4 11h16" stroke="white" stroke-width="1.6" />
        </svg>
      </span>
      <span class="logo-text">Auto<span class="accent">Care</span></span>
    </a>

    <!-- Hero copy -->
    <div class="hero-copy">
      <h1>The workshop, <span class="accent">reimagined</span>.</h1>
      <p class="lead">One dashboard for admins, managers, mechanics and owners. Live status, chat, invoices — all in one
        place.</p>
    </div>

    <!-- Sign-in card -->
    <div class="signin-card">
      <a class="back-link" href="landing.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5M11 6l-6 6 6 6" stroke="#545E6F" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        back to home
      </a>

      <h2>Sign in to AutoCare</h2>
      <p class="card-sub">Choose a role for this demo session.</p>

      <form class="signin-form">
        <label for="email">Email</label>
        <input id="email" type="email">

        <label for="password">Password</label>
        <input id="password" type="password">

        <button type="submit" class="btn-continue">Continue</button>

        <a class="forgot-link" href="#">Forgot password?</a>
      </form>
    </div>

  </div>

  <script src="../assets/js/login.js"></script>
</body>

</html>
